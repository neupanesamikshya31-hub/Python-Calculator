
<!DOCTYPE html>
<html>
    <head>
        <title>My Calculator</title>
        <link rel="stylesheet" href="../static/style.css">
    </head>

    <body>
        <div class="calc">

        <h1>Calculator</h1>

        <div class="display">
            <input type="text" placeholder="0">
        </div>

        <div class="button-row">
            <button class="blue-button" id="clear">AC</button>
            <button class="blue-button" id="delete">DEL</button>
            <button class="blue-button" id="percent">%</button>
            <button class="operator-button">/</button>
        </div>

        <div class="button-row">
            <button class="number-button">7</button>
            <button class="number-button">8</button>
            <button class="number-button">9</button>
            <button class="operator-button">*</button>
        </div>

        <div class="button-row">
            <button class="number-button">4</button>
            <button class="number-button">5</button>
            <button class="number-button">6</button>
            <button class="operator-button">-</button>
        </div>

        <div class="button-row">
            <button class="number-button">1</button>
            <button class="number-button">2</button>
            <button class="number-button">3</button>
            <button class="operator-button">+</button>
        </div>

        <div class="button-row">
            <button class="number-button">0</button>
             <button class="blue-button" id="bracket">()</button>
            <button class="blue-button" id="decimal">.</button>
            <button class="blue-button" id="equal">=</button>
            
        </div>
</div>

<script src="../static/script.js"></script>
    </body>
</html>
